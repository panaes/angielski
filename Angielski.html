<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Detektyw w pokoju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: jedna kolumna jak zeszyt, grube kontury i "wciskane" przyciski jak naklejki z podręcznika */
:root{
  --sky:#dff0f2; --ink:#1d2b4f; --muted:#56638a; --paper:#ffffff;
  --coral:#ff6b4a; --mustard:#f4b63f; --teal:#1f8a8a;
  --good:#2e9e5b; --goodbg:#c9f0d6; --bad:#d9412b; --badbg:#ffe0d9;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:2.4rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.25rem;font-weight:800}
p{margin:0}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
.en{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.01em}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px dashed var(--coral);text-align:center;color:var(--coral)}

.hero{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.hero .txt{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.chip{align-self:flex-start;background:var(--mustard);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem;letter-spacing:.03em;text-transform:uppercase}
.muted{color:var(--muted)}
.scene{width:100%;height:auto;display:block}
.visual .scene{border:3px solid var(--ink);border-radius:14px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mode .t{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.1}
.mode .d{font-size:.88rem;color:var(--muted)}
.mode .stars{display:flex;gap:2px;margin-top:4px}
.mode.wide{grid-column:1/-1;background:var(--coral);flex-direction:row;align-items:center;gap:12px}
.mode.wide .d{color:var(--ink)}
.mode.wide .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mode.soft{grid-column:1/-1;background:var(--mustard);flex-direction:row;align-items:center;gap:12px}
.mode.soft .d{color:var(--ink)}

.bar{display:flex;align-items:center;gap:10px}
.back{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.prog{flex:1;height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal)}
.count{font-weight:800;font-variant-numeric:tabular-nums}

.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:16px}
.prompt{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-size:1.1rem}
.prompt > div{min-width:0}
.spk{flex:none;width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bigicon{display:grid;place-items:center;background:var(--sky);border:3px solid var(--ink);border-radius:16px;padding:10px}

.opts{display:grid;gap:12px}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{font-weight:800;font-size:1.08rem;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px;min-height:56px;box-shadow:0 4px 0 var(--ink);text-align:center}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt.dim{opacity:.5}

.line{min-height:64px;border:3px dashed var(--muted);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.line.ok{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.line.no{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{font-weight:800;font-size:1.15rem;background:var(--mustard);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;min-width:48px;min-height:48px;box-shadow:0 3px 0 var(--ink)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile.in{background:var(--paper)}
.slot{width:44px;height:52px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.5rem;display:grid;place-items:center;padding:0}
.slot.empty{border-style:dashed;border-color:var(--muted)}
.letter{font-family:var(--display);font-size:1.4rem;padding:4px 0;min-width:52px}
.check{background:var(--teal);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 var(--ink)}
.check:disabled{opacity:.45;cursor:default}
.reset{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:800}
.reset .row2{width:100%;max-width:340px}
.reset .clear:disabled{opacity:.45;cursor:default}
.check.danger{background:var(--bad)}
.row2{display:flex;gap:10px}
.row2 > *{flex:1}
.clear{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px;font-weight:800;box-shadow:0 4px 0 var(--ink)}

.fb{border:3px solid var(--good);background:var(--goodbg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb strong{font-family:var(--display);font-size:1.5rem}
.next{align-self:stretch;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:1.15rem}

.end{align-items:center;text-align:center}
.bigstars{display:flex;gap:6px}
.score{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}

.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gi{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px;display:flex;align-items:center;gap:8px;text-align:left;box-shadow:0 3px 0 var(--ink);min-width:0}
.gi b{display:block;font-family:var(--display);font-size:1.05rem;line-height:1.1}
.gi span{font-size:.85rem;color:var(--muted)}
.rule{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 10px;background:var(--sky);border-radius:10px}
.pair .pl{font-size:.88rem;color:var(--muted)}
.goal{display:flex;align-items:center;gap:10px;background:var(--mustard);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15;box-shadow:0 4px 0 var(--ink)}
.goal svg{flex:none}
.goal b{color:var(--coral);font-size:1.6rem;-webkit-text-stroke:.5px var(--ink)}
.hello{font-family:var(--display);font-weight:800;font-size:1.3rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.link{background:none;border:0;padding:0;font-family:var(--body);font-size:.9rem;font-weight:800;color:var(--teal);text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(29,43,79,.55);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:22px;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .2s ease-out}
.dialog > button{width:100%}
.dialog input{width:100%;font:800 1.3rem var(--body);color:var(--ink);background:var(--sky);border:3px solid var(--ink);border-radius:14px;padding:12px;text-align:center}
.dialog input:focus{outline:4px solid var(--coral);outline-offset:2px}
.err{color:var(--bad);font-weight:800}
.badge{align-self:flex-start;margin-top:4px;font-size:.78rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border:2px dashed var(--muted);color:var(--muted);border-radius:999px;padding:1px 8px;display:inline-flex;align-items:center;gap:4px}
.badge.on{border:2px solid var(--good);background:var(--goodbg);color:var(--good)}
.mode.locked{background:#e9eef0;box-shadow:0 5px 0 var(--muted);border-color:var(--muted);cursor:not-allowed}
.mode.locked .d{color:var(--ink)}
.pips{display:flex;gap:6px;margin-top:4px}
.pips i{width:22px;height:10px;border-radius:999px;border:2px solid var(--ink);background:var(--paper)}
.pips i.on{background:var(--good)}
.dipwrap{background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.dipsvg{display:block;width:100%;height:auto}
.check.print{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--coral);font-size:1.2rem;padding:10px 14px}
.check.print svg{background:#fff;border-radius:8px;flex:none}
.mode.hall{background:#f3e1c4}
.dipwrap.gold{border:4px solid #a87c0a;box-shadow:0 6px 0 #a87c0a}
.newdip{text-align:center;display:flex;flex-direction:column;gap:2px}
.newdip h2{font-size:2.2rem;color:var(--coral)}
/* Sala dyplomów: ściana w paski, listwa, podłoga z desek */
.room{border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.wallp{padding:26px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:30px;
  background:repeating-linear-gradient(90deg,#cfe7ea 0 22px,#c4e0e4 22px 44px)}
.skirting{height:14px;background:#a86d3a;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.boards{height:46px;background:repeating-linear-gradient(90deg,#d9a066 0 58px,#c98a52 58px 61px)}
.frames{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 16px;width:100%}
.frame{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;width:calc(33.333% - 11px);min-width:0;max-width:170px}
.frame .pic{display:block;width:100%;aspect-ratio:600/848;background:#fff;border:8px solid #8a5a2b;outline:3px solid var(--ink);box-shadow:0 6px 10px rgba(29,43,79,.35);overflow:hidden}
.frame .thumb{display:block;width:100%;height:100%}
.frame .nail{position:absolute;top:-14px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.frame .nail::before,.frame .nail::after{content:"";position:absolute;top:5px;width:2px;height:22px;background:var(--ink);transform-origin:top}
.frame .nail::before{left:4px;transform:rotate(38deg)}
.frame .nail::after{left:4px;transform:rotate(-38deg)}
.frame .plate{font-family:var(--display);font-weight:800;font-size:.85rem;line-height:1.1;background:linear-gradient(#f5d77a,#d9ad3c);border:2px solid var(--ink);border-radius:6px;padding:3px 8px;text-align:center;max-width:100%}
button.frame{cursor:pointer}
button.frame:active .pic{transform:translateY(2px)}
.frame.empty .pic{background:repeating-linear-gradient(45deg,#f4f6f8 0 8px,#eaeef2 8px 16px);border-color:#b9a38c;outline-style:dashed}
.ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;opacity:.6;font-size:.72rem;font-weight:800;color:var(--muted)}
.ph b{font-family:var(--display);font-size:1.8rem;line-height:1;color:var(--ink)}
.frame.big{width:min(100%,290px);max-width:290px}
.frame.big .pic{border:16px solid #e0a91a;outline:4px solid var(--ink);box-shadow:0 0 0 7px #f4d36b inset,0 8px 14px rgba(29,43,79,.4)}
.frame.big.empty .pic{border-color:#e7cf8a}
.frame.big .plate{font-size:1.1rem;padding:5px 14px;background:linear-gradient(#ffe48a,#e0a91a)}
.frame.big .ph{font-size:.95rem}
.frame.big .ph b{font-size:3rem}
.frame.big::before{content:"";position:absolute;top:-22px;width:120px;height:30px;background:var(--coral);border:3px solid var(--ink);border-radius:6px;z-index:1;
  clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,8% 50%)}
.frame.big::after{content:"MISTRZ";position:absolute;top:-18px;z-index:2;font-family:var(--display);font-weight:800;color:#fff;letter-spacing:.18em;font-size:.95rem}
.frame.big .nail{display:none}
.diploma{background:var(--paper);border:6px double var(--ink);outline:4px solid var(--mustard);outline-offset:-14px;border-radius:8px;padding:34px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.dl{font-family:var(--display);font-weight:800;font-size:2.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);line-height:1}
.dfor{font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800}
.dname{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05;border-bottom:3px solid var(--ink);padding:0 12px 4px;max-width:100%;overflow-wrap:anywhere}
.dmeta{font-weight:800;font-variant-numeric:tabular-nums}
.dsign{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.fb{animation:pop .18s ease-out}
</style>

function place(o,p){const s=p.h/50;return `<g transform="translate(${(p.x-30*s).toFixed(1)} ${(p.y-56*s).toFixed(1)}) scale(${s.toFixed(3)})">${o.svg}</g>`}
function scene(fk,prep,ok){const f=F[fk],o=O[ok];const inner=prep==='in'?f.inBack+place(o,f.at.in)+f.inFront:f.draw+place(o,f.at[prep]);return `<svg class="scene" viewBox="0 0 320 190" role="img" aria-label="Obrazek pokoju">${ROOM}${inner}</svg>`}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

let CNT={};try{CNT=JSON.parse(localStorage.getItem('dp_cnt')||'{}')||{}}catch(e){CNT={}}
function draw(name,items){
  const c=CNT[name]||(CNT[name]={});
  const min=Math.min(...items.map(k=>c[k]||0));
  const k=pick(items.filter(x=>(c[x]||0)===min));
  c[k]=(c[k]||0)+1;
  try{localStorage.setItem('dp_cnt',JSON.stringify(CNT))}catch(e){}
  return k;
}

function genVocab(word){
  const w=word||draw('word',V.map(v=>v.en)),it=V.find(v=>v.en===w),others=shuffle(V.filter(v=>v!==it)).slice(0,3),dir=Math.floor(Math.random()*3);
  const base={type:'choice',cols:2,say:it.en,fb:`<b>${it.en}</b> = ${it.pl}`};
  if(dir===2)return{...base,key:'v2'+it.en,prompt:`Co znaczy <span class="en">${it.en}</span>?`,sayBtn:it.en,options:shuffle([it,...others]).map(v=>v.pl),answer:it.pl};
  return{...base,key:'v'+dir+it.en,prompt:dir===0?'Co to jest po angielsku?':`Jak powiesz po angielsku: <b>${it.pl}</b>?`,visual:dir===0?`<div class="bigicon">${icon(it.ic,120)}</div>`:'',options:shuffle([it,...others]).map(v=>v.en),answer:it.en};
}
function genScene(){
  const r=rnd(),sent=(p,pr)=>`${pr} ${PREP[p]} the ${r.f.en}.`;
  const other=shuffle(['on','in','under','next'].filter(p=>p!==r.prep)).slice(0,2);
  const ans=sent(r.prep,r.pron);
  return{type:'choice',cols:1,key:'s'+r.fk+r.prep+r.ok,prompt:`Popatrz i odpowiedz:<br><span class="en">${qOf(r.o)}</span>`,sayBtn:qOf(r.o),visual:scene(r.fk,r.prep,r.ok),options:shuffle([ans,...other.map(p=>sent(p,r.pron)),sent(r.prep,r.wrong)]),answer:ans,say:ans,fb:plSent(r.o,r.f,r.prep)};
}
function genIsAre(){
  const r=rnd();
  if(Math.random()<.5){
    const a=r.o.plural?'are':'is';
    return{type:'choice',cols:2,key:'ia'+r.ok,prompt:`Wstaw <b>is</b> albo <b>are</b>:<br><span class="en">Where <span class="gap">___</span> the ${r.o.en}?</span>`,visual:scene(r.fk,r.prep,r.ok),options:['is','are'],answer:a,say:`Where ${a} the ${r.o.en}?`,fb:r.o.plural?`<b>${r.o.en}</b> to kilka rzeczy, więc <b>are</b>.`:`<b>${r.o.en}</b> to jedna rzecz, więc <b>is</b>.`};
  }
  return{type:'choice',cols:2,key:'ib'+r.ok+r.fk+r.prep,prompt:`<span class="en">${qOf(r.o)}</span><br><span class="en"><span class="gap">___</span> ${PREP[r.prep]} the ${r.f.en}.</span>`,visual:scene(r.fk,r.prep,r.ok),options:["It's","They're"],answer:r.pron,say:`${r.pron} ${PREP[r.prep]} the ${r.f.en}.`,fb:r.o.plural?`Kilka rzeczy, więc <b>They're</b>. ${plSent(r.o,r.f,r.prep)}`:`Jedna rzecz, więc <b>It's</b>. ${plSent(r.o,r.f,r.prep)}`};
}
function genBuild(){
  const r=rnd();let words,distract,prompt,fb;
  if(Math.random()<.5){
    words=[r.pron,...PREP[r.prep].split(' '),'the',...r.f.en.split(' ')];words[words.length-1]+='.';
    distract=r.wrong;prompt=`Ułóż odpowiedź na pytanie:<br><span class="en">${qOf(r.o)}</span>`;fb=plSent(r.o,r.f,r.prep);
  }else{
    words=['Where',r.o.plural?'are':'is','the',...r.o.en.split(' ')];words[words.length-1]+='?';
    distract=r.o.plural?'is':'are';prompt=`Zapytaj po angielsku:<br><b>„Gdzie ${r.o.plural?'są':'jest'} ${r.o.pl.toLowerCase()}?”</b>`;fb=`Gdzie ${r.o.plural?'są':'jest'} ${r.o.pl.toLowerCase()}? = <b>${words.join(' ')}</b>`;
  }
  return{type:'build',key:'b'+words.join(''),prompt,visual:scene(r.fk,r.prep,r.ok),answer:words,tiles:shuffle([...words,distract]),say:words.join(' '),fb};
}
const SPELL=V.filter(v=>!v.en.includes(' ')).map(v=>v.en);
function genSpell(){
  const w=draw('spell',SPELL),it=V.find(v=>v.en===w),letters=w.split('');
  let tiles=shuffle(letters);
  for(let t=0;t<10&&tiles.join('')===w;t++)tiles=shuffle(letters);

}

function start(id){

  const m=id==='test'?EXAM:MODES.find(x=>x.id===id);
  const gens=id==='test'?shuffle(m.gens):Array(m.n).fill(m.gen);
  const keys=new Set();let qs=[];
  if(id==='slowka')qs=shuffle(V).map(v=>genVocab(v.en));

/* ---------- Dyplom: format A4 pionowy (600×848), ten sam rysunek na ekranie i w PDF ---------- */
function laurel(cx,cy,r,side){
  const P=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const a0=side<0?100:80,a1=side<0?232:-52,[x1,y1]=P(a0),[x2,y2]=P(a1);
  let s=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 ${side<0?1:0} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#14666a" stroke-width="2.5" stroke-linecap="round"/>`;
  for(let i=0;i<8;i++){
    const a=a0+(a1-a0)*(i+.5)/8,[x,y]=P(a);
    for(const o of [-1,1]){
      const rot=a+90*(side<0?1:-1)+o*35,dx=Math.cos(a*Math.PI/180)*o*6,dy=Math.sin(a*Math.PI/180)*o*6;
      s+=`<ellipse cx="${(x+dx).toFixed(1)}" cy="${(y+dy).toFixed(1)}" rx="10" ry="4.6" transform="rotate(${rot.toFixed(1)} ${(x+dx).toFixed(1)} ${(y+dy).toFixed(1)})" fill="${(i+o)%2?'#1f8a8a':'#2fa69d'}" stroke="#1d2b4f" stroke-width="1.2"/>`;
    }
  }
  return s;
}

async function diplomaPDF(id,rec){
  if(!window.jspdf)throw {code:'nolib'};
  try{await Promise.all(['800 40px "Baloo 2"','600 20px "Nunito"','800 20px "Nunito"'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=600,H=848,k=3;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W*k}" height="${H*k}">${diplomaArt(id)}</svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const c=document.createElement('canvas');c.width=W*k;c.height=H*k;
  const x=c.getContext('2d');x.drawImage(img,0,0,W*k,H*k);URL.revokeObjectURL(url);
  x.scale(k,k);x.textAlign='center';x.textBaseline='alphabetic';
  for(const t of diplomaTexts(id,rec)){
    x.font=`${t.w} ${t.size}px "${t.font}", sans-serif`;x.fillStyle=t.fill;
    if('letterSpacing' in x)x.letterSpacing=(t.ls||0)+'px';
    x.fillText(t.t,300+(t.ls||0)/2,t.y);
  }
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,210,297);
  return pdf.output('blob');
}

  if(s>(best[st.mode]||0)){best[st.mode]=s;saveBest()}
  if(st.score===n)return renderDiploma();
  const msg=s===3?'Jesteś gotowy na sprawdzian!':s===2?'Bardzo dobrze. Jeszcze jedna runda i będzie komplet.':s===1?'Dobry początek. Zajrzyj do ściągi i spróbuj jeszcze raz.':'Zacznij od ściągi, posłuchaj słówek i wróć tutaj.';
  return `<section class="card end">
    <h2>${st.title}</h2>
    <div class="bigstars">${stars(s,48)}</div>
    <div class="score">${st.score}/${n}</div>
    <p>${msg}</p>
    <div class="row2" style="width:100%"><button class="clear" data-act="menu">Menu</button><button class="check" data-act="start" data-id="${st.mode}">Jeszcze raz</button></div>
  </section>`;
}

function prepMini(p){
  const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="8" fill="#ff6b4a" ${S2}/>`,box=(x,y,h)=>`<rect x="${x}" y="${y}" width="30" height="${h}" fill="#d9a066" ${S2}/>`;
  let g=`<path d="M4 58h82" ${S2}/>`;
  if(p==='on')g+=box(30,32,26)+ball(45,24);
  if(p==='in')g+=`<rect x="30" y="28" width="30" height="30" fill="#b8803f" ${S2}/>`+ball(45,36)+box(30,40,18);
  if(p==='under')g+=`<rect x="25" y="32" width="4" height="26" fill="${BD}" ${S2}/><rect x="61" y="32" width="4" height="26" fill="${BD}" ${S2}/><rect x="21" y="27" width="48" height="6" fill="${B}" ${S2}/>`+ball(45,50);
  if(p==='next')g+=box(20,32,26)+ball(68,50);
  return `<svg viewBox="0 0 90 64" width="72" height="51" aria-hidden="true">${g}</svg>`;
}
function renderGloss(){
  const groups=[['Mój pokój (str. 6–7)',['window','clock','bookshelf','lamp','laptop','bin','wardrobe','door','wall','floor','curtains']],['Lekcja 5 (str. 11)',['rug','poster','toy chest','bedside table']],['Komputer (str. 12)',['keyboard','webcam','hard drive','printer','mouse']],['Przydatne meble',['bed','desk','table']]];
  const item=v=>`<button class="gi" data-act="say" data-t="${esc(v.en)}">${icon(v.ic,44)}<span><b>${v.en}</b><span>${v.pl}</span></span></button>`;
  return `<div class="bar"><button class="back" data-act="menu">← Menu</button><h2 style="flex:1">Ściąga</h2></div>
  <p class="muted">Stuknij słówko, żeby usłyszeć wymowę.</p>
  ${groups.map(([t,ws])=>`<h3>${t}</h3><div class="gl">${ws.map(w=>item(V.find(v=>v.en===w))).join('')}</div>`).join('')}
  <h3>Gdzie? (str. 8)</h3>
  <div class="gl">${['on','in','under','next'].map(p=>`<button class="gi" data-act="say" data-t="${PREP[p]}">${prepMini(p)}<span><b>${PREP[p]}</b><span>${PREP_PL[p]}</span></span></button>`).join('')}</div>
  <h3>Pytania i odpowiedzi</h3>
  <div class="rule">
    <p><b>Jedna rzecz</b> → <span class="en">Where’s</span> (Where is) … ? → <span class="en">It’s</span> …</p>
    <div class="pair"><span class="en">Where is the lamp?</span><span class="en">It’s on the bedside table.</span><span class="pl">Gdzie jest lampa? Jest na szafce nocnej.</span></div>
    <p><b>Kilka rzeczy</b> → <span class="en">Where are</span> … ? → <span class="en">They’re</span> …</p>
    <div class="pair"><span class="en">Where are the lamps?</span><span class="en">They’re on the bedside table.</span><span class="pl">Gdzie są lampy? Są na szafce nocnej.</span></div>
    <div class="pair"><span class="en">Where are the pens?</span><span class="en">They’re next to the laptop.</span><span class="pl">Gdzie są długopisy? Są obok laptopa.</span></div>
    <p class="muted">Podpowiedź: na końcu słowa jest <b>-s</b> (books, pens, shoes)? To znaczy, że jest ich kilka: <b>are</b> i <b>They’re</b>.</p>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=st.screen==='menu'?renderMenu():st.screen==='play'?renderPlay():st.screen==='end'?renderEnd():st.screen==='gallery'?renderGallery():st.screen==='dip'?renderDipView():renderGloss();
}

let NAME='';try{NAME=localStorage.getItem('dp_name')||''}catch(e){}
let MODAL={kind:'name'};
function renderModal(){
  const m=document.getElementById('modal');
  if(!MODAL){m.innerHTML='';return}
  if(MODAL.kind==='name'){
    m.innerHTML=`<div class="overlay"><form class="dialog" id="nameForm" role="dialog" aria-labelledby="nameTitle">
      ${icon('door',72)}
      <h2 id="nameTitle">Jak masz na imię?</h2>
      <p class="muted">Wpiszemy je na Twój dyplom.</p>
      <input id="nameInput" type="text" maxlength="20" autocomplete="given-name" placeholder="Twoje imię" value="${esc(NAME)}">
      <p class="err" id="nameErr" hidden>Wpisz swoje imię, żeby zacząć.</p>
      <button class="check" type="submit">Zaczynamy!</button>
    </form></div>`;
    const inp=document.getElementById('nameInput');try{inp.focus()}catch(e){}
  }else{
    const {score,n}=MODAL,miss=n-score;
    m.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-labelledby="encTitle">
      <div class="bigstars">${stars(score/n>=.9?3:score/n>=.7?2:score/n>=.4?1:0,40)}</div>
      <h2 id="encTitle">${score/n>=.7?'Już prawie!':'Nie poddawaj się!'}</h2>
      <p>${NAME?esc(NAME)+', m':'M'}asz <b>${score} z ${n}</b> dobrych odpowiedzi. Do 100% ${miss===1?'brakuje tylko 1 odpowiedzi':'brakuje '+miss+' odpowiedzi'}.</p>
      <p><b>Za bezbłędny wynik dostaniesz dyplom ze swoim imieniem.</b> Spróbujesz jeszcze raz?</p>
      <button class="check" data-act="retry">Spróbuję jeszcze raz!</button>
      <button class="clear" data-act="closeModal">Zobacz wynik</button>
    </div></div>`;
  }
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='nameForm')return;e.preventDefault();
  const v=document.getElementById('nameInput').value.trim();
  if(!v){document.getElementById('nameErr').hidden=false;return}
  NAME=v.charAt(0).toUpperCase()+v.slice(1);try{localStorage.setItem('dp_name',NAME)}catch(err){}
  MODAL=null;renderModal();render();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,q=st.qs&&st.qs[st.i];
  if(a==='askName'){MODAL={kind:'name'};renderModal();return}
  if(a==='closeModal'){MODAL=null;renderModal();return}
  if(a==='retry'){MODAL=null;renderModal();start(st.mode);return}
  if(a==='menu'){st={screen:'menu'};render();window.scrollTo(0,0)}
  else if(a==='gloss'){st={screen:'gloss'};render();window.scrollTo(0,0)}
  else if(a==='start')start(b.dataset.id);
  else if(a==='say')say(b.dataset.t);
  else if(a==='resetAsk'){st.confirmReset=true;render()}
  else if(a==='resetNo'){st.confirmReset=false;render()}
  else if(a==='resetYes'){best={};saveBest();DONE={};saveDone();DIPL={};saveDipl();CNT={};NAME='';
    try{['dp_cnt','dp_name'].forEach(k=>localStorage.removeItem(k))}catch(err){}
    st={screen:'menu'};render();MODAL={kind:'name'};renderModal()}
  else if(a==='gallery'){st={screen:'gallery'};render();window.scrollTo(0,0)}
  else if(a==='viewDip'){st={screen:'dip',id:b.dataset.id};render();window.scrollTo(0,0)}
  else if(a==='print')printDiploma(b);
  else if(a==='choose'&&!st.done){st.chosen=+b.dataset.i;finish(q.options[st.chosen]===q.answer)}
  else if(a==='place'&&!st.done){const i=+b.dataset.i;if(q.type==='spell'){if(st.placed.length<q.answer.length)st.placed.push(i)}else st.placed.push(i);render()}
  else if(a==='unplace'&&!st.done){st.placed.splice(+b.dataset.k,1);render()}
  else if(a==='clear'&&!st.done){st.placed=[];render()}
  else if(a==='check'&&!st.done){const got=st.placed.map(t=>q.tiles[t]);finish(q.type==='spell'?got.join('')===q.answer.join(''):got.join(' ')===q.answer.join(' '))}
  else if(a==='next'){st.i++;if(st.i>=st.qs.length){st.screen='end';if(st.mode!=='test'){DONE[st.mode]=true;saveDone()}if(st.score===st.qs.length){DIPL[st.mode]={name:NAME,date:new Date().toISOString(),n:st.qs.length};saveDipl()}if(st.score<st.qs.length)MODAL={kind:'enc',score:st.score,n:st.qs.length}}else{st.done=false;st.placed=[];st.chosen=-1}render();renderModal();window.scrollTo(0,0)}
});
render();renderModal();
</script>

</body></html>
